packages:
  all:
    # Filled in per arch by the Dockerfile. Only the target is required here: an os
    # requirement (to keep the cache's ubuntu builds out) also stops spack from reusing the
    # rocky9 ones, so the one place an ubuntu binary could slip in is handled in the
    # Dockerfile instead (see the intel-oneapi-compilers install).
    require:
    - "target=@SPACK_TARGET@"
    permissions:
      read: world
      write: user
    providers:
      mpi: [mpich, openmpi, intel-oneapi-mpi]
