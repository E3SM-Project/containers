modules:
  default:
    # One tree for everything: spack names the arch folder after each spec's os, so without
    # this, binaries reused from the cache (os=rocky9) and those built here (os=rhel9) would
    # land in two different Core directories.
    arch_folder: false
    enable:
      - lmod
    roots:
      lmod: /modulefiles
    # LIBRARY_PATH as well as LD_LIBRARY_PATH: the compiler searches LIBRARY_PATH at link
    # time, so a bare -lfoo that a package records in its flags without the matching -L (e.g.
    # the -lz in MOAB's MOAB_PACKAGE_LIBS, from hdf5's zlib) still finds spack's library.
    prefix_inspections:
      lib:
        - LD_LIBRARY_PATH
        - LIBRARY_PATH
      lib64:
        - LD_LIBRARY_PATH
        - LIBRARY_PATH
    lmod:
      hash_length: 0
      hierarchy:
        - mpi
      naming_scheme: '{name}/{version}'
      projections:
        all: '{name}/{version}'
      hide_implicits: true
      # Explicit targets for <pkg>_ROOT generation in the module files
      openmpi:
        environment:
          set:
            'OPENMPI_ROOT': '{prefix}'
            'MPI_ROOT': '{prefix}'
      mpich:
        environment:
          set:
            'MPICH_ROOT': '{prefix}'
            'MPI_ROOT': '{prefix}'
      boost:
        environment:
          set:
            'BOOST_ROOT': '{prefix}'
      yaml-cpp:
        environment:
          set:
            'YAML_CPP_ROOT': '{prefix}'
      netlib-lapack:
        environment:
          set:
            'BLAS_ROOT': '{prefix}'
            'LAPACK_ROOT': '{prefix}'
      openblas:
        environment:
          set:
            'BLAS_ROOT': '{prefix}'
            'LAPACK_ROOT': '{prefix}'
      hdf5:
        environment:
          set:
            'HDF5_ROOT': '{prefix}'
      netcdf-c:
        environment:
          set:
            'NETCDF_C_ROOT': '{prefix}'
      netcdf-fortran:
        environment:
          set:
            'NETCDF_FORTRAN_ROOT': '{prefix}'
      parallel-netcdf:
        environment:
          set:
            'PARALLEL_NETCDF_ROOT': '{prefix}'
      moab:
        environment:
          set:
            'MOAB_ROOT': '{prefix}'
