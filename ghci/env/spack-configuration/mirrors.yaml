# Prebuilt binaries from E4S (https://oaciss.uoregon.edu/e4s/inventory.html). Anything the
# concretizer can reuse from here is installed in seconds instead of built; anything it
# cannot (a version, variant or compiler the cache does not have) is built from source.
# NOTE: with `reuse: true` (concretizer.yaml) this can change what gets built, not only how
# fast: for anything the specs leave open (versions of unconstrained roots such as boost,
# and of dependencies), the solver prefers what the cache already has over the newest.
#
# E4S's rocky9 stack is the one that matches: rocky9 has glibc 2.34, same as UBI9 (the os
# names are bridged in concretizer.yaml), and it is built with gcc-toolset-13 (gcc 13.3.1),
# which is the gcc our images use. The rest of cache.spack.io / binaries.spack.io is built
# on ubuntu 22.04+ (newer glibc, so not loadable here) or with other compilers.
#
# The index is fetched from the mirror at concretization time; nothing is stored locally.
#
# e3sm is our own cache, on GHCR: what our builds produce and E4S does not have (openmpi 4,
# the MPI-dependent I/O stack, MOAB, what is built with the oneAPI compilers). CI pushes to it
# after a published image passes its smoke tests (the `buildcache` job in
# .github/workflows/ghci.yaml). Packages whose recipe forbids binary redistribution (the oneAPI
# compilers and MKL among them) are never pushed, since this cache is public; spack downloads
# those rather than building them, so leaving them out costs little.
# It is read anonymously, so the package has to be public. It is listed first so our binaries
# win over E4S's when both have the same spec. OCI mirrors are never signed.
# NOTE: with `reuse: true` (concretizer.yaml) the concretizer prefers whatever is in this cache
# for an unconstrained spec, so what reaches it influences every later build's solution, not
# just its build time. That is why only main, tags and maintainer-run dispatches push to it.
mirrors:
  e3sm:
    url: oci://ghcr.io/e3sm-project/e3sm-spack-buildcache
    signed: false
    source: false
  e4s:
    url: https://cache.e4s.io/26.06
    source: false
