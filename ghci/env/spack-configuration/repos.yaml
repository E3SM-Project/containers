# Pin the package recipes to the release the E4S cache below was built from, so the
# concretizer sees the same versions and variants the cached binaries have.
# The e3sm repo comes first, so its few overrides (see repos/spack_repo/e3sm) win.
repos:
  e3sm: /spack-configuration/repos/spack_repo/e3sm
  builtin:
    git: https://github.com/spack/spack-packages.git
    tag: v2026.06.0
    destination: /spack-packages
