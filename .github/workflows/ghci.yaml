name: ghci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [ main ]
    tags:
      - 'ghci-*'

  merge_group:
    branches: [ main ]

  workflow_dispatch:

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# base -> <compiler>-<version> -> <compiler>-<backend>-env -> ...-dev, each stage building
# FROM the arch-independent tag the previous one published. See build-multiarch.yaml.
#
# Path filtering happens inside the workflow (the `changes` job below) rather than on the
# triggers above. A trigger-level `paths:` filter makes GitHub skip scheduling the whole run,
# which means a PR touching only unrelated files never gets a check run for `required-check`
# at all -- and a required status check that was never requested blocks merging forever. Since
# `required-check` is unconditional (`if: always()`) it posts a conclusion on every run, so
# branch protection / the merge queue always has something to wait on.
jobs:
  # merge_group can't use path filters at the trigger level (a GitHub limitation), a
  # workflow_dispatch run is a deliberate manual request, and a ghci-* tag can point at a
  # commit that itself touches nothing ghci-related (the filter would then see no diff and
  # skip the release build) -- all three are always treated as relevant. Every other event
  # only builds when ghci-relevant files changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter fetches the changed-file list from the REST API on pull_request
      # events (not from local git diff, even though we've already checked out), so it needs
      # read access to the PR itself.
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant || steps.force.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        with:
          filters: |
            relevant:
              - 'ghci/**'
              - '.github/workflows/ghci.yaml'
              - '.github/workflows/build-multiarch.yaml'
              - 'scripts/**'
      - id: force
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  # The suffix build-multiarch.yaml's metadata step appends to every tag in this run, so each
  # stage builds FROM the image the previous stage just published rather than main's:
  # -pr-<N> on a PR, -mg-<sha> on a merge_group run, -<version> on a ghci-<version> tag,
  # -<branch> on a non-main dispatch. A fork PR publishes nothing, so its stages build FROM
  # main's images instead -- it has no packages:write to publish anything with.
  #
  # merge_group gets its own ephemeral suffix (keyed on the merge commit sha, not the PR
  # number) rather than reusing main's images like a fork PR does: unlike a fork PR, a
  # merge_group run *can* publish, and if it built FROM main's stale tags instead, a PR that
  # changes both an upstream stage (e.g. ghci/base) and a downstream one (ghci/compiler)
  # would never have that combination validated together -- compiler would build FROM
  # whatever base main last published, not the new base this same run just built. sha (not PR
  # number) keys the suffix because merge queues can batch several PRs into one merge_group
  # run, so there may be no single PR number to key on.
  suffix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.suffix.outputs.value }}
    steps:
      - id: suffix
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            value="-mg-$SHA"
          elif [ "$EVENT" = pull_request ] && [ "$FORK" = true ]; then
            value=""
          elif [ "$EVENT" = pull_request ]; then
            value="-pr-$PR"
          elif [ "$REF_TYPE" = tag ]; then
            value="-${REF_NAME#ghci-}"
          elif [ "$REF_NAME" != main ]; then
            # metadata-action's sanitization of branch names
            # shellcheck disable=SC2001
            value="-$(sed 's/[^a-zA-Z0-9._-]/-/g' <<< "$REF_NAME")"
          else
            value=""
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile shell syntax
        run: python3 scripts/check-dockerfiles.py
      - name: Check smoke script syntax
        run: bash -n ghci/tests/smoke.sh
      - name: Test Python dependency-check guard
        run: python3 -m unittest discover -s ghci/tests -p 'test_*.py' -v
      - name: Check all GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  base:
    needs: [changes, suffix, lint]
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image_name: e3sm-ghci
      tag: base
      context: ghci/base
      description: Base image for E3SM ghci containers
      tag_suffix: ${{ needs.suffix.outputs.value }}

  compiler:
    needs: [suffix, base]
    name: ${{ matrix.compiler }}
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gnu
            spack_compiler: gcc
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
          # Intel oneAPI ships for x86_64 only
          - compiler: intel
            spack_compiler: oneapi
            version: 2024.1.0
            arches: '["x86_64"]'
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.compiler }}-${{ matrix.version }}
      context: ghci/compiler
      arches: ${{ matrix.arches }}
      description: ${{ matrix.compiler }} compiler image for E3SM ghci containers
      tag_suffix: ${{ needs.suffix.outputs.value }}
      build_args: |
        COMPILER=${{ matrix.spack_compiler }}
        COMPILER_VERSION=${{ matrix.version }}
        BASE_TAG=base${{ needs.suffix.outputs.value }}

  # The variant list: one context (ghci/final), one set of build args per env.
  final-env:
    needs: [suffix, compiler]
    name: ${{ matrix.env }}
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gnu-cpu-env
            compiler: gnu
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
            args: |
              MPI_SPEC=openmpi@4.1.4
              LAPACK_SPEC=netlib-lapack
              DEBUG_SPECS=valgrind@3.20~mpi gdb@13.1
              WITH_CUDA=no
              WITH_MOAB=yes
          - env: gnu-cuda-env
            compiler: gnu
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
            args: |
              MPI_SPEC=mpich@4.1.1
              LAPACK_SPEC=netlib-lapack
              DEBUG_SPECS=
              WITH_CUDA=yes
              WITH_MOAB=no
          # Intel oneAPI ships for x86_64 only
          - env: intel-cpu-env
            compiler: intel
            version: 2024.1.0
            arches: '["x86_64"]'
            args: |
              MPI_SPEC=openmpi@4.1.4
              LAPACK_SPEC=intel-oneapi-mkl
              DEBUG_SPECS=valgrind@3.20~mpi
              WITH_CUDA=no
              WITH_MOAB=no
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.env }}
      context: ghci/final
      arches: ${{ matrix.arches }}
      description: ${{ matrix.env }} image for E3SM testing and development
      tag_suffix: ${{ needs.suffix.outputs.value }}
      build_args: |
        BASE_TAG=${{ matrix.compiler }}-${{ matrix.version }}${{ needs.suffix.outputs.value }}
        ${{ matrix.args }}

  dev:
    needs: [suffix, final-env]
    name: ${{ matrix.env }}-dev
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gnu-cpu-env
            arches: '["x86_64", "aarch64"]'
          - env: gnu-cuda-env
            arches: '["x86_64", "aarch64"]'
          - env: intel-cpu-env
            arches: '["x86_64"]'
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.env }}-dev
      context: ghci/dev
      arches: ${{ matrix.arches }}
      description: ${{ matrix.env }} plus developer tooling
      tag_suffix: ${{ needs.suffix.outputs.value }}
      build_args: |
        BASE_TAG=${{ matrix.env }}${{ needs.suffix.outputs.value }}
        VARIANT=${{ matrix.env }}

  # Smoke-test freshly published images on separate runners, so pulling/running them
  # does not compete with Spack builds for disk space. Fork PRs cannot publish an image
  # to test; testing main's tag there would give a misleading green result.
  smoke:
    needs: [suffix, final-env]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gnu-cpu-env
            arch: x86_64
          - env: gnu-cpu-env
            arch: aarch64
          - env: gnu-cuda-env
            arch: x86_64
          - env: gnu-cuda-env
            arch: aarch64
          - env: intel-cpu-env
            arch: x86_64
    name: smoke (${{ matrix.env }}, ${{ matrix.arch }})
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/e3sm-ghci:${{ matrix.env }}${{ needs.suffix.outputs.value }}
      EXPECT_CUDA: ${{ contains(matrix.env, 'cuda') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and measure the built image
        run: |
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          docker pull "${IMAGE,,}"
          python3 scripts/image-size.py "${IMAGE,,}" --json > image-size.json
          python3 scripts/image-size.py "${IMAGE,,}" >> "$GITHUB_STEP_SUMMARY"
      - name: Test login environment, Python, NetCDF, and MPI
        run: |
          docker run --rm -e EXPECT_CUDA \
            -v "$PWD/ghci/tests:/opt/ghci-tests:ro" \
            "$IMAGE" bash -l /opt/ghci-tests/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-size-${{ matrix.env }}-${{ matrix.arch }}
          path: image-size.json
          if-no-files-found: warn
          retention-days: 30

  # The one job to mark as a required status check / merge-queue check. It always runs
  # (`if: always()`) and only fails if a needed job actually failed or was cancelled -- a
  # job the `changes` filter caused to be skipped is not a failure. This is what makes a
  # docs-only PR mergeable: the real build jobs never even get scheduled, but this job still
  # posts a conclusion, so the required check is never left permanently "Expected".
  required-check:
    name: required-check
    needs: [changes, suffix, lint, base, compiler, final-env, dev, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
