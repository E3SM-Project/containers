name: ghci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [ main ]
    tags:
      - 'ghci-*'

  merge_group:
    branches: [ main ]

  workflow_dispatch:

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# base -> <compiler>-<version> -> <compiler>-<backend>-env -> ...-dev, each stage building
# FROM the arch-independent tag the previous one published. See build-multiarch.yaml.
#
# Path filtering happens inside the workflow (the `changes` job below) rather than on the
# triggers above. A trigger-level `paths:` filter makes GitHub skip scheduling the whole run,
# which means a PR touching only unrelated files never gets a check run for `required-check`
# at all -- and a required status check that was never requested blocks merging forever. Since
# `required-check` is unconditional (`if: always()`) it posts a conclusion on every run, so
# branch protection / the merge queue always has something to wait on.
jobs:
  # merge_group can't use path filters at the trigger level (a GitHub limitation), and a
  # workflow_dispatch run is a deliberate manual request, so both are always treated as
  # relevant; every other event only builds when ghci-relevant files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant || steps.force.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            relevant:
              - 'ghci/**'
              - '.github/workflows/ghci.yaml'
              - '.github/workflows/build-multiarch.yaml'
      - id: force
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  # The suffix build-multiarch.yaml's metadata step appends to every tag in this run, so each
  # stage builds FROM the image the previous stage just published rather than main's:
  # -pr-<N> on a PR, -<version> on a ghci-<version> tag, -<branch> on a non-main dispatch.
  # A fork PR, or a merge_group run, publishes nothing, so its stages build FROM main's
  # images instead.
  suffix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.suffix.outputs.value }}
    steps:
      - id: suffix
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            value=""
          elif [ "$EVENT" = pull_request ] && [ "$FORK" = true ]; then
            value=""
          elif [ "$EVENT" = pull_request ]; then
            value="-pr-$PR"
          elif [ "$REF_TYPE" = tag ]; then
            value="-${REF_NAME#ghci-}"
          elif [ "$REF_NAME" != main ]; then
            # metadata-action's sanitization of branch names
            value="-$(sed 's/[^a-zA-Z0-9._-]/-/g' <<< "$REF_NAME")"
          else
            value=""
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  base:
    needs: [changes, suffix]
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image_name: e3sm-ghci
      tag: base
      context: ghci/base
      description: Base image for E3SM ghci containers

  compiler:
    needs: [suffix, base]
    name: ${{ matrix.compiler }}
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gnu
            spack_compiler: gcc
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
          # Intel oneAPI ships for x86_64 only
          - compiler: intel
            spack_compiler: oneapi
            version: 2024.1.0
            arches: '["x86_64"]'
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.compiler }}-${{ matrix.version }}
      context: ghci/compiler
      arches: ${{ matrix.arches }}
      description: ${{ matrix.compiler }} compiler image for E3SM ghci containers
      build_args: |
        COMPILER=${{ matrix.spack_compiler }}
        COMPILER_VERSION=${{ matrix.version }}
        BASE_TAG=base${{ needs.suffix.outputs.value }}

  # The variant list: one context (ghci/final), one set of build args per env.
  final-env:
    needs: [suffix, compiler]
    name: ${{ matrix.env }}
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gnu-cpu-env
            compiler: gnu
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
            args: |
              MPI_SPEC=openmpi@4.1.4
              LAPACK_SPEC=netlib-lapack
              DEBUG_SPECS=valgrind@3.20~mpi gdb@13.1
              WITH_CUDA=no
              WITH_MOAB=yes
          - env: gnu-cuda-env
            compiler: gnu
            version: 13.3.0
            arches: '["x86_64", "aarch64"]'
            args: |
              MPI_SPEC=mpich@4.1.1
              LAPACK_SPEC=netlib-lapack
              DEBUG_SPECS=
              WITH_CUDA=yes
              WITH_MOAB=no
          # Intel oneAPI ships for x86_64 only
          - env: intel-cpu-env
            compiler: intel
            version: 2024.1.0
            arches: '["x86_64"]'
            args: |
              MPI_SPEC=openmpi@4.1.4
              LAPACK_SPEC=intel-oneapi-mkl
              DEBUG_SPECS=valgrind@3.20~mpi
              WITH_CUDA=no
              WITH_MOAB=no
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.env }}
      context: ghci/final
      arches: ${{ matrix.arches }}
      description: ${{ matrix.env }} image for E3SM testing and development
      build_args: |
        BASE_TAG=${{ matrix.compiler }}-${{ matrix.version }}${{ needs.suffix.outputs.value }}
        ${{ matrix.args }}

  dev:
    needs: [suffix, final-env]
    name: ${{ matrix.env }}-dev
    uses: ./.github/workflows/build-multiarch.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gnu-cpu-env
            arches: '["x86_64", "aarch64"]'
          - env: gnu-cuda-env
            arches: '["x86_64", "aarch64"]'
          - env: intel-cpu-env
            arches: '["x86_64"]'
    with:
      image_name: e3sm-ghci
      tag: ${{ matrix.env }}-dev
      context: ghci/dev
      arches: ${{ matrix.arches }}
      description: ${{ matrix.env }} plus developer tooling
      build_args: |
        BASE_TAG=${{ matrix.env }}${{ needs.suffix.outputs.value }}
        VARIANT=${{ matrix.env }}

  # The one job to mark as a required status check / merge-queue check. It always runs
  # (`if: always()`) and only fails if a needed job actually failed or was cancelled -- a
  # job the `changes` filter caused to be skipped is not a failure. This is what makes a
  # docs-only PR mergeable: the real build jobs never even get scheduled, but this job still
  # posts a conclusion, so the required check is never left permanently "Expected".
  required-check:
    name: required-check
    needs: [changes, suffix, base, compiler, final-env, dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
