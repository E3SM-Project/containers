name: omega-case

# Builds Omega standalone and runs its CTests in each image (ghci/tests/omega-case.sh), with
# the image's own CIME machine and Metis/ParMETIS. The smoke tests in ghci.yaml prove the
# toolchain works; this proves Omega itself builds and passes its tests on it, the way
# Omega's own CI uses the images.
#
# - weekly, against the published tags and Omega develop: catches an Omega or CIME change
#   that breaks how the images package their machine or Metis/ParMETIS (or the reverse);
# - from ghci.yaml, against a PR's freshly built images, when the PR touches the CIME
#   machine or this test;
# - by hand (workflow_dispatch) against any suffix and Omega ref (branch, tag or sha).
#
# Not part of ghci.yaml's required-check or promote: Omega develop moves independently of
# this repo, and an Omega-side breakage must not block merging or publishing image fixes.
on:
  schedule:
    - cron: '53 7 * * 1'
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Image tag suffix: empty for the published tags, or -pr-<N>, -rc-<run_id>, -<version>'
        required: false
        type: string
        default: ''
      omega_ref:
        description: 'E3SM-Project/Omega branch, tag or sha'
        required: false
        type: string
        default: develop
  workflow_call:
    inputs:
      suffix:
        required: false
        type: string
        default: ''
      omega_ref:
        required: false
        type: string
        default: develop

# The name is spelled out: called from ghci.yaml, github.workflow is "ghci", and e3sm-case and
# omega-case would then share one group and cancel each other.
concurrency:
  group: omega-case-${{ github.event_name }}-${{ inputs.suffix || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  case:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # ghci.yaml's CPU variants, times Omega's two build types. The CUDA image is left out:
      # hosted runners have no GPU to run the tests on. x86_64 only for now: Omega's standalone
      # build reads the CIME macros before project(), so on aarch64 it gets x86's
      # -mcmodel=medium and fails to configure (E3SM-Project/Omega#610). Add aarch64 back
      # (excluding intel there) once that is fixed.
      matrix:
        env: [gnu13-openmpi4, intel2024-openmpi4]
        arch: [x86_64]
        build_type: [Release, Debug]
    name: omega-case (${{ matrix.env }}, ${{ matrix.arch }}, ${{ matrix.build_type }})
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/e3sm-image:${{ matrix.env }}${{ inputs.suffix }}
      OMEGA_BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      # Hosted runners start with ~20 GB free; the image and an Omega build need more. These
      # are preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Omega
        uses: actions/checkout@v7
        with:
          repository: E3SM-Project/Omega
          ref: ${{ inputs.omega_ref || 'develop' }}
          path: Omega
          show-progress: false
          persist-credentials: false
      # Only the submodules a standalone build needs (Omega's doc/devGuide/CMakeBuild.md);
      # several use git@ URLs, rewritten to https for this command only.
      - name: Check out Omega's submodules
        run: |
          git -C Omega -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init --recursive --depth 1 \
            externals/YAKL externals/ekat externals/scorpio components/omega/external cime
      # One cache for every job (the meshes depend on nothing but the test's list of them)
      - name: Restore meshes
        id: meshes
        uses: actions/cache/restore@v6
        with:
          path: meshes
          key: omega-meshes-${{ hashFiles('ghci/tests/omega-case.sh') }}
          restore-keys: omega-meshes-
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        run: |
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          docker pull "${IMAGE,,}"
      # As the image's default user (uid 1000), whose home the script opts into the image's
      # CIME machine. The runner's own uid is 1001, so hand it what the build writes to, and
      # take it back after for the cache and the log upload.
      - name: Build Omega and run its CTests
        run: |
          mkdir -p meshes scratch
          sudo chown -R 1000:1000 Omega meshes scratch
          rc=0
          docker run --rm --shm-size=1g -e OMEGA_BUILD_TYPE \
            -v "$PWD/Omega:/projects/e3sm/work/Omega" \
            -v "$PWD/meshes:/projects/e3sm/data/omega-meshes" \
            -v "$PWD/scratch:/home/e3sm/e3sm_scratch" \
            -v "$PWD/ghci/tests:/opt/ghci-tests:ro" \
            "$IMAGE" bash -l /opt/ghci-tests/omega-case.sh || rc=$?
          sudo chown -R "$(id -u):$(id -g)" Omega meshes scratch
          {
            echo "### ${{ matrix.env }} (${{ matrix.arch }}), ${{ matrix.build_type }}"
            echo
            # Which Omega this tested, so a scheduled failure can be traced to a commit
            echo "Omega \`$(git -C Omega rev-parse --short HEAD)\` ($(git -C Omega log -1 --format=%cs)), image \`$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")\`"
            echo
            echo '```'
            grep -E 'tests passed|tests failed|\*\*\*Failed|\(Failed\)|\(Timeout\)' \
              scratch/omega-build/omega-ctest.log 2>/dev/null || echo "no ctest summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Save meshes
        if: steps.meshes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: meshes
          key: ${{ steps.meshes.outputs.cache-primary-key }}
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: omega-case-${{ matrix.env }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            scratch/omega-build/omega-ctest.log
            scratch/omega-build/e3smcase/*.log*
            scratch/omega-build/Testing/Temporary/Last*.log
            scratch/omega-build/test/logs/*.log
          if-no-files-found: warn
          retention-days: 14
