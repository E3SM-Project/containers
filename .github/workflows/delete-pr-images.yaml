name: Cleanup PR Docker Images

on:
  pull_request:
    types: [ closed ]
    paths:
      - 'ghci-snl/**'
      - '.github/workflows/ghci-snl.yaml'

jobs:
  delete-pr-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR Image Versions from GHCR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const package_type = 'container';
            const package_name = 'e3sm-ghci-snl';
            const pr = context.payload.pull_request.number;
            const tagRe = new RegExp(`-pr-${pr}$`);

            async function listVersions(route, params) {
              const versions = [];
              for await (const res of github.paginate.iterator(route, { ...params, per_page: 100 })) {
                versions.push(...res.data);
              }
              return versions;
            }

            let versions;
            try {
              versions = await listVersions(
                'GET /orgs/{org}/packages/{package_type}/{package_name}/versions',
                { org: owner, package_type, package_name }
              );
            } catch (e) {
              versions = await listVersions(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type, package_name }
              );
            }

            const toDelete = versions.filter(v => (v.metadata?.container?.tags || []).some(t => tagRe.test(t)));
            core.info(`Found ${toDelete.length} version(s) to delete for PR #${pr}`);

            for (const v of toDelete) {
              try {
                await github.request(
                  'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org: owner, package_type, package_name, package_version_id: v.id }
                );
              } catch (e) {
                await github.request(
                  'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { username: owner, package_type, package_name, package_version_id: v.id }
                );
              }
              core.info(`Deleted package version id=${v.id} tags=${(v.metadata?.container?.tags || []).join(',')}`);
            }
