name: Cleanup PR Docker Images

on:
  pull_request:
    types: [ closed ]
    paths:
      - 'ghci-snl/**'
      - '.github/workflows/ghci-snl.yaml'

jobs:
  delete-pr-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR Image Tag from GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'e3sm-ghci-snl'
          package-type: 'container'
          # Targets the exact tag format generated by docker/metadata-action for PRs
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          # Match the pr-<number> tag format
          tag-name: '.*-pr-${{ github.event.pull_request.number }}$'
