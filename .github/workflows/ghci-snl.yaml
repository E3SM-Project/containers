name: ghci-snl

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ghci-snl/**'
      - '.github/workflows/ghci-snl.yaml'
  push:
    branches: [ main ]
    paths:
      - 'ghci-snl/**'
      - '.github/workflows/ghci-snl.yaml'
    tags:
      - 'ghci-snl-*'

  workflow_dispatch:


# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/e3sm-ghci-snl
          tags: |
            type=raw,value=base,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr,prefix=base-pr-
            type=ref,event=branch,prefix=base-
            type=match,pattern=ghci-snl-(.*),group=1,prefix=base-
          labels: |
            org.opencontainers.image.description=Base image for E3SM ghci-snl containers used for testing on github actions

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ghci-snl/base/
          file: ghci-snl/base/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
