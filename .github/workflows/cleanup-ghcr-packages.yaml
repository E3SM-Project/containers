name: Cleanup GHCR Packages

on:
  pull_request:
    types: [closed]
    # Every path that makes ghci.yaml publish -pr-<N> images (its `changes` filters)
    paths:
      - 'ghci/**'
      - '.github/workflows/*.yaml'
      - 'scripts/**'
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'

  # Allows manual cleanup on a day where lots of untagged images got generated
  workflow_dispatch:
    inputs:
      hours_old:
        description: 'Minimum age (in hours) of untagged images to delete'
        required: true
        default: '48'
        type: number
      dry_run:
        description: 'Only log what would be deleted'
        required: false
        default: false
        type: boolean

# What gets deleted, and from which packages, is decided by scripts/cleanup_ghcr.py (its rules
# are tested in ghci.yaml's `lint` job). The jobs below only pass the event's inputs through.
jobs:
  delete-pr-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The default branch's copy of the script, not the closed PR's: this job holds
      # packages:write, and a closed (unmerged) PR's merge ref may no longer exist anyway.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete Closed PR Images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/cleanup_ghcr.py pr-closed

  cleanup-untagged:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # <-- Triggered by cron OR manual button
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Delete Old Untagged/Buildcache Remnants
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          # Both empty on the schedule, where the script then uses 48 hours and deletes for real.
          HOURS_OLD: ${{ inputs.hours_old }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/cleanup_ghcr.py untagged
