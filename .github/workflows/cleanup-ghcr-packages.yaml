name: Cleanup GHCR Packages

on:
  pull_request:
    types: [closed]
    paths:
      - 'ghci/**'
      - 'ghci-snl/**'
      - '.github/workflows/*.yaml'
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'

  # Allows manual cleanup on a day where lots of untagged images got generated
  workflow_dispatch:
    inputs:
      hours_old:
        description: 'Minimum age (in hours) of untagged images to delete'
        required: true
        default: '48'
        type: number

env:
  # Every package this repo publishes. Keep in sync with the workflows.
  PACKAGES: >-
    e3sm-ghci
    e3sm-ghci-snl

jobs:
  delete-pr-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Closed PR Images
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const package_type = 'container';
            const pr = context.payload.pull_request.number;
            const tagRe = new RegExp(`-pr-${pr}$`);

            async function listVersions(package_name) {
              const versions = [];
              const attempts = [
                ['GET /orgs/{org}/packages/{package_type}/{package_name}/versions', { org: owner }],
                ['GET /users/{username}/packages/{package_type}/{package_name}/versions', { username: owner }],
              ];
              let lastError;
              for (const [route, scope] of attempts) {
                try {
                  for await (const res of github.paginate.iterator(route, { ...scope, package_type, package_name, per_page: 100 })) {
                    versions.push(...res.data);
                  }
                  return versions;
                } catch (e) {
                  lastError = e;
                  versions.length = 0;
                }
              }
              throw lastError;
            }

            async function deleteVersion(package_name, id) {
              try {
                await github.request('DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org: owner, package_type, package_name, package_version_id: id });
              } catch (e) {
                await github.request('DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { username: owner, package_type, package_name, package_version_id: id });
              }
            }

            for (const package_name of process.env.PACKAGES.split(/\s+/).filter(Boolean)) {
              let versions;
              try {
                versions = await listVersions(package_name);
              } catch (e) {
                core.info(`Skipping ${package_name}: ${e.message}`);
                continue;
              }

              // A version can carry several tags: a fully cached PR build is byte-identical to
              // main's, so one digest may hold both `base` and `base-pr-N`. Deleting it would take
              // the main tag down too, so only delete versions no other tag still points at.
              const toDelete = versions.filter(v => {
                const tags = v.metadata?.container?.tags || [];
                return tags.length > 0 && tags.every(t => tagRe.test(t));
              });
              core.info(`${package_name}: found ${toDelete.length} version(s) to delete for PR #${pr}`);

              for (const v of toDelete) {
                await deleteVersion(package_name, v.id);
                core.info(`Deleted ${package_name} version id=${v.id} tags=${(v.metadata?.container?.tags || []).join(',')}`);
              }
            }

  cleanup-untagged:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # <-- Triggered by cron OR manual button
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Old Untagged/Buildcache Remnants
        uses: actions/github-script@v7
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const org = context.repo.owner;
            const package_type = 'container';

            const inputHours = context.payload.inputs?.hours_old;
            const minHours = inputHours !== undefined ? parseFloat(inputHours) : 48;
            core.info(`Targeting untagged images and merge_group -mg-<sha> images older than ${minHours} hours.`);

            const tags = v => v.metadata?.container?.tags || [];

            // buildcache-* tags are never swept by age while still live. An earlier version of this
            // job deleted the *current* buildcache-<tag>-<arch> pointer once it turned 48h old,
            // reasoning it was an orphaned tag from a stage/arch combo no longer built -- but
            // base/compiler layers routinely go longer than that between rebuilds, so it was really
            // deleting the only cache build-multiarch.yaml had for that stage/arch, forcing the next
            // PR touching anything downstream into a fully cold build. A buildcache tag only ever
            // points at one digest at a time, so once a fresh `cache-to` moves it to a new digest,
            // the superseded digest becomes genuinely untagged and is swept by the ordinary
            // untagged-version branch below -- no age check keyed on the tag name is needed for that
            // case. A stage/arch combo that stops being built entirely keeps its buildcache tag (and
            // the blobs it references) around indefinitely; on a public package that costs nothing.

            // merge_group runs publish under an ephemeral <tag>-mg-<sha> tag (see
            // build-multiarch.yaml) so that stage-to-stage chaining works within that one
            // validation run; there is no single PR to key cleanup on the way delete-pr-images
            // does (a merge_group run can batch several PRs), so these age out here instead,
            // same as genuinely untagged versions.
            //
            // A merge_group build can be byte-identical to a same-PR pull_request build (a
            // stage the PR didn't touch), in which case GHCR attaches BOTH tags to the one
            // shared version -- e.g. ["base-pr-123", "base-mg-<sha>"]. delete-pr-images (which
            // only fires for its own closing PR's number) and a pure -mg-only check both
            // conservatively refuse to touch a version unless every tag matches their own
            // pattern, so a version like that would never qualify for either and would sit
            // there forever. Once at least one tag is -mg-*, treat every other -pr-<N>-only
            // tag alongside it as equally ephemeral too -- but only then: a version tagged
            // solely -pr-<N> (no -mg- tag at all, e.g. a still-open PR nobody has re-pushed
            // in a while) is intentionally left alone here, exactly as before this change;
            // delete-pr-images remains the only thing that ever removes those, on PR close.
            const mgRe = /-mg-[0-9a-f]{40}$/;
            const prRe = /-pr-\d+$/;
            const isEphemeralMergeGroup = v => {
              const t = tags(v);
              return t.length > 0 && t.some(x => mgRe.test(x)) && t.every(x => mgRe.test(x) || prRe.test(x));
            };

            // A version is sweepable-by-age if it's genuinely untagged, or if every one of its
            // tags is an ephemeral merge_group/PR tag. A live buildcache-* tag is never sweepable
            // (see above); a superseded one falls out of `tagged` entirely once retagged and is
            // picked up by the genuinely-untagged case instead.
            const isSweepable = v => isEphemeralMergeGroup(v);

            // The per-arch images a multi-arch tag points at are themselves UNTAGGED package
            // versions, so deleting untagged versions by age would break every multi-arch
            // tag. Resolve each tagged manifest and treat what it references as in use.
            const registryOrg = org.toLowerCase();
            const registryAuth = Buffer.from(process.env.GHCR_TOKEN).toString('base64');
            const MANIFEST_ACCEPT = [
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
            ].join(',');

            async function referencedDigests(package_name, digest) {
              const url = `https://ghcr.io/v2/${registryOrg}/${package_name}/manifests/${digest}`;
              const res = await fetch(url, {
                headers: { Authorization: `Bearer ${registryAuth}`, Accept: MANIFEST_ACCEPT },
              });
              if (!res.ok) {
                // Cannot read the manifest -> do not know what it references -> delete nothing
                throw new Error(`manifest ${digest} -> HTTP ${res.status}`);
              }
              const body = await res.json();
              return (body.manifests || []).map(m => m.digest);
            }

            for (const package_name of process.env.PACKAGES.split(/\s+/).filter(Boolean)) {
              let versions = [];
              try {
                const route = 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions';
                for await (const res of github.paginate.iterator(route, { org, package_type, package_name, per_page: 100 })) {
                  versions.push(...res.data);
                }
              } catch (error) {
                core.info(`Skipping ${package_name}: ${error.message}`);
                continue;
              }
              core.info(`${package_name}: ${versions.length} version(s) retrieved`);

              const tagged = versions.filter(v => tags(v).length > 0);
              // A sweepable (mg-only/mg+pr) version is never the digest a real published tag's
              // manifest list points at, so it doesn't need to protect anything by being marked
              // in-use. A live buildcache-* tag is never sweepable, so its own digest lands in
              // `inUse` here too; it isn't pushed with image-manifest=true, so it can itself be an
              // OCI index referencing several untagged config/layer blobs used for cache import --
              // those get protected the same way, via referencedDigests() below.
              const inUse = new Set(tagged.filter(v => !isSweepable(v)).map(v => v.name));
              let resolvable = true;
              for (const v of tagged) {
                try {
                  for (const d of await referencedDigests(package_name, v.name)) inUse.add(d);
                } catch (e) {
                  core.warning(`${package_name}: cannot resolve ${v.name} (${e.message}); skipping this package to avoid deleting a live image`);
                  resolvable = false;
                  break;
                }
              }
              if (!resolvable) continue;

              const now = new Date();
              const toDelete = versions.filter(v => {
                if (tags(v).length > 0 && !isSweepable(v)) return false;
                if (inUse.has(v.name)) return false;
                return (now - new Date(v.created_at)) / 36e5 > minHours;
              });
              core.info(`${package_name}: ${toDelete.length} version(s) match (untagged or merge_group), ${inUse.size} digest(s) in use`);

              for (const v of toDelete) {
                try {
                  await github.request(
                    'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    { org, package_type, package_name, package_version_id: v.id }
                  );
                  core.info(`Deleted ${package_name} version id=${v.id} tags=${tags(v).join(',')}`);
                } catch (deleteError) {
                  core.warning(`Failed to delete ${package_name} version id=${v.id}: ${deleteError.message}`);
                }
              }
            }
