name: Cleanup GHCR Packages

on:
  pull_request:
    types: [closed]
    paths:
      - 'ghci/**'
      - 'ghci-snl/**'
      - '.github/workflows/*.yaml'
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'

  # Allows manual cleanup on a day where lots of untagged images got generated
  workflow_dispatch:
    inputs:
      hours_old:
        description: 'Minimum age (in hours) of untagged images to delete'
        required: true
        default: '24'
        type: number

env:
  # Every package this repo publishes. Keep in sync with the workflows.
  PACKAGES: >-
    e3sm-ghci
    e3sm-ghci-snl

jobs:
  delete-pr-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Closed PR Images
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const package_type = 'container';
            const pr = context.payload.pull_request.number;
            const tagRe = new RegExp(`-pr-${pr}$`);

            async function listVersions(package_name) {
              const versions = [];
              const attempts = [
                ['GET /orgs/{org}/packages/{package_type}/{package_name}/versions', { org: owner }],
                ['GET /users/{username}/packages/{package_type}/{package_name}/versions', { username: owner }],
              ];
              let lastError;
              for (const [route, scope] of attempts) {
                try {
                  for await (const res of github.paginate.iterator(route, { ...scope, package_type, package_name, per_page: 100 })) {
                    versions.push(...res.data);
                  }
                  return versions;
                } catch (e) {
                  lastError = e;
                  versions.length = 0;
                }
              }
              throw lastError;
            }

            async function deleteVersion(package_name, id) {
              try {
                await github.request('DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org: owner, package_type, package_name, package_version_id: id });
              } catch (e) {
                await github.request('DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { username: owner, package_type, package_name, package_version_id: id });
              }
            }

            for (const package_name of process.env.PACKAGES.split(/\s+/).filter(Boolean)) {
              let versions;
              try {
                versions = await listVersions(package_name);
              } catch (e) {
                core.info(`Skipping ${package_name}: ${e.message}`);
                continue;
              }

              const toDelete = versions.filter(v => (v.metadata?.container?.tags || []).some(t => tagRe.test(t)));
              core.info(`${package_name}: found ${toDelete.length} version(s) to delete for PR #${pr}`);

              for (const v of toDelete) {
                await deleteVersion(package_name, v.id);
                core.info(`Deleted ${package_name} version id=${v.id} tags=${(v.metadata?.container?.tags || []).join(',')}`);
              }
            }

  cleanup-untagged:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # <-- Triggered by cron OR manual button
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Old Untagged Remnants
        uses: actions/github-script@v7
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const org = context.repo.owner;
            const package_type = 'container';

            const inputHours = context.payload.inputs?.hours_old;
            const minHours = inputHours !== undefined ? parseFloat(inputHours) : 24;
            core.info(`Targeting untagged images older than ${minHours} hours.`);

            // The per-arch images a multi-arch tag points at are themselves UNTAGGED package
            // versions, so deleting untagged versions by age would break every multi-arch
            // tag. Resolve each tagged manifest and treat what it references as in use.
            const registryOrg = org.toLowerCase();
            const registryAuth = Buffer.from(process.env.GHCR_TOKEN).toString('base64');
            const MANIFEST_ACCEPT = [
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
            ].join(',');

            async function referencedDigests(package_name, digest) {
              const url = `https://ghcr.io/v2/${registryOrg}/${package_name}/manifests/${digest}`;
              const res = await fetch(url, {
                headers: { Authorization: `Bearer ${registryAuth}`, Accept: MANIFEST_ACCEPT },
              });
              if (!res.ok) {
                // Cannot read the manifest -> do not know what it references -> delete nothing
                throw new Error(`manifest ${digest} -> HTTP ${res.status}`);
              }
              const body = await res.json();
              return (body.manifests || []).map(m => m.digest);
            }

            for (const package_name of process.env.PACKAGES.split(/\s+/).filter(Boolean)) {
              let versions = [];
              try {
                const route = 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions';
                for await (const res of github.paginate.iterator(route, { org, package_type, package_name, per_page: 100 })) {
                  versions.push(...res.data);
                }
              } catch (error) {
                core.info(`Skipping ${package_name}: ${error.message}`);
                continue;
              }
              core.info(`${package_name}: ${versions.length} version(s) retrieved`);

              const tagged = versions.filter(v => (v.metadata?.container?.tags || []).length > 0);
              const inUse = new Set(tagged.map(v => v.name));
              let resolvable = true;
              for (const v of tagged) {
                try {
                  for (const d of await referencedDigests(package_name, v.name)) inUse.add(d);
                } catch (e) {
                  core.warning(`${package_name}: cannot resolve ${v.name} (${e.message}); skipping this package to avoid deleting a live image`);
                  resolvable = false;
                  break;
                }
              }
              if (!resolvable) continue;

              const now = new Date();
              const toDelete = versions.filter(v => {
                if ((v.metadata?.container?.tags || []).length > 0) return false;
                if (inUse.has(v.name)) return false;
                return (now - new Date(v.created_at)) / 36e5 > minHours;
              });
              core.info(`${package_name}: ${toDelete.length} untagged version(s) match, ${inUse.size} digest(s) in use`);

              for (const v of toDelete) {
                try {
                  await github.request(
                    'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    { org, package_type, package_name, package_version_id: v.id }
                  );
                  core.info(`Deleted ${package_name} untagged version id=${v.id}`);
                } catch (deleteError) {
                  core.warning(`Failed to delete ${package_name} version id=${v.id}: ${deleteError.message}`);
                }
              }
            }
