name: Cleanup GHCR Packages

on:
  pull_request:
    types: [closed]
    paths:
      - 'ghci-snl/**'
      - '.github/workflows/ghci-snl.yaml'
  schedule:
    # Run weekly on Sundays at 2:00 AM UTC
    - cron: '0 2 * * *'

  # Allows manual cleanup on a day where lots of untagged images got generated
  workflow_dispatch:
    inputs:
      hours_old:
        description: 'Minimum age (in hours) of untagged images to delete'
        required: true
        default: '24'
        type: number
jobs:
  delete-pr-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Closed PR Images
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const package_type = 'container';
            const package_name = 'e3sm-ghci-snl';
            const pr = context.payload.pull_request.number;
            const tagRe = new RegExp(`-pr-${pr}$`);

            async function listVersions(route, params) {
              const versions = [];
              for await (const res of github.paginate.iterator(route, { ...params, per_page: 100 })) {
                versions.push(...res.data);
              }
              return versions;
            }

            let versions;
            try {
              versions = await listVersions('GET /orgs/{org}/packages/{package_type}/{package_name}/versions', { org: owner, package_type, package_name });
            } catch (e) {
              versions = await listVersions('GET /users/{username}/packages/{package_type}/{package_name}/versions', { username: owner, package_type, package_name });
            }

            const toDelete = versions.filter(v => (v.metadata?.container?.tags || []).some(t => tagRe.test(t)));
            core.info(`Found ${toDelete.length} version(s) to delete for PR #${pr}`);

            for (const v of toDelete) {
              try {
                await github.request('DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}', { org: owner, package_type, package_name, package_version_id: v.id });
              } catch (e) {
                await github.request('DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}', { username: owner, package_type, package_name, package_version_id: v.id });
              }
              core.info(`Deleted package version id=${v.id} tags=${(v.metadata?.container?.tags || []).join(',')}`);
            }

  cleanup-untagged:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # <-- Triggered by cron OR manual button
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Old Untagged Remnants
        uses: actions/github-script@v7
        with:
          script: |
            const org = context.repo.owner;
            const package_type = 'container';
            const package_name = 'e3sm-ghci-snl';

            const inputHours = context.payload.inputs?.hours_old;
            const minHours = inputHours !== undefined ? parseFloat(inputHours) : 24;
            core.info(`Targeting untagged images older than ${minHours} hours.`);

            async function listVersions() {
              const versions = [];
              const route = 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions';
              const params = { org, package_type, package_name, per_page: 100 };

              for await (const res of github.paginate.iterator(route, params)) {
                versions.push(...res.data);
              }
              return versions;
            }

            let versions = [];
            try {
              versions = await listVersions();
            } catch (error) {
              core.setFailed(`Failed to fetch package versions: ${error.message}`);
              return;
            }

            core.info(`Total versions retrieved from API: ${versions.length}`);

            const now = new Date();
            const toDelete = versions.filter(v => {
              const tags = v.metadata?.container?.tags || [];
              if (tags.length > 0) return false;

              const createdAt = new Date(v.created_at);
              const ageHours = (now - createdAt) / (1000 * 60 * 60);
              return ageHours > minHours;
            });

            core.info(`Found ${toDelete.length} untagged version(s) matching criteria.`);

            for (const v of toDelete) {
              try {
                await github.request(
                  'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org, package_type, package_name, package_version_id: v.id }
                );
                core.info(`Successfully deleted untagged package version id=${v.id}`);
              } catch (deleteError) {
                core.warning(`Failed to delete version id=${v.id}: ${deleteError.message}`);
              }
            }
