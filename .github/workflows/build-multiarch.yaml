# Builds one image for several arches and publishes it under a SINGLE, arch-independent
# tag. Each arch is built natively on its own runner and pushed by digest; the merge job
# then stitches the digests into one manifest list, so `podman pull <tag>` resolves to the
# caller's arch and no tag ever needs an arch in its name.
name: build-multiarch

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Package name under ghcr.io/<owner>/'
        required: true
        type: string
      tag:
        description: 'Arch-independent tag to publish (e.g. gnu-cpu-env)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      arches:
        description: 'JSON array of arches to build'
        required: false
        type: string
        default: '["x86_64", "aarch64"]'
      build_args:
        required: false
        type: string
        default: ''
      description:
        required: false
        type: string
        default: ''
      tag_suffix:
        description: >-
          This run's suffix (-pr-<N>, -mg-<sha>, -rc-<run_id>), same as what the caller
          appends to BASE_TAG build-args. The image is published as <tag><tag_suffix> only:
          the tags people pull are never written by a build, only by ghci.yaml's `promote`
          job, once the image has been tested. Empty only for a fork PR, which publishes
          nothing.
        required: false
        type: string
        default: ''
      cache_suffix:
        description: >-
          Scope of this run's BuildKit cache writes: empty for the shared cache that main,
          tags and every PR read, -pr-<N> or -<branch> for unreviewed work -- see the
          cache-from/cache-to comment below.
        required: false
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
  # BuildKit's registry cache lives in its own package, so its tags don't bury the ones people
  # pull on the image's package page.
  CACHE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}-buildcache
  # A fork PR gets no packages:write, so nothing can be pushed and there is nothing to merge:
  # it still builds every stage, as validation, FROM the images main published. merge_group
  # runs are not excluded here: they publish too (under an ephemeral -mg-<sha> tag), so that a
  # stage this PR changes builds FROM the sibling stage this same run just published, not from
  # main's possibly-stale tag.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    name: ${{ inputs.tag }} (${{ matrix.arch }})

    steps:
      # github.repository_owner is mixed case (E3SM-Project) and image refs must be
      # lowercase. metadata-action does this itself; a raw buildx ref does not.
      - name: Lowercase image ref
        run: |
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "CACHE=${CACHE,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          show-progress: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only needed to push; the parent images are public, so a fork PR pulls them anonymously.
      - name: GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels (source, revision, created, licenses, ...) for this image's config. Without
      # them it carries the UBI base image's, and GHCR shows no source or description. Only
      # the config changes per commit; the cached layers are unaffected.
      - name: Labels
        id: labels
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ inputs.tag }}
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          build-args: ${{ inputs.build_args }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=${{ env.PUSH }},name-canonical=true,push=${{ env.PUSH }}
          # Registry cache (one tag per compiler/env x arch, same as the images themselves) rather than
          # actions/cache: the latter is scoped per-branch and shares a repo-wide 10GB/7-day eviction
          # budget across every open PR, so a PR's own cache writes routinely evict main's (or each
          # other's) entries and the next build starts from scratch. A registry tag has no such quota
          # and isn't branch-scoped, so PRs and main naturally share it. Skipped on cache-to for fork
          # PRs, which can't push; they still read whatever main last published.
          #
          # cache-to writes this run's <tag><cache_suffix>-<arch> tag. For a PR (or a dispatch on
          # another branch) that is its own suffixed tag, never the plain <tag>-<arch> one every
          # other run reads from: a PR that touches this stage's Dockerfile would otherwise
          # overwrite the shared cache with its own not-yet-reviewed content, forcing every
          # unrelated concurrent PR (and main itself, if this PR never merges) into a cold rebuild
          # the next time they import it. cache-from still reads the plain tag too (as a second,
          # lower-priority source), so a PR's first build still benefits from the shared cache;
          # its own suffixed tag only exists once this run's cache-to has written it at least once
          # (e.g. a second push to the same PR), and a not-yet-existing cache-from source is a
          # soft error buildx logs and skips, not a build failure.
          #
          # The merge queue, tags and dispatches on main write the shared tag (empty
          # cache_suffix). A push to main no longer builds anything (it promotes what the merge
          # queue tested), so the queue is what keeps the shared cache current. Its content is
          # reviewed and about to land, and a cache is keyed by content: a batch the queue drops
          # costs later builds some cache hits, never a wrong image.
          #
          # TRANSITION: the third cache-from line reads the cache's old location, the
          # buildcache-<tag>-<arch> tags in the image package, so the first builds after the move
          # are still warm. Remove it once main has written the new package.
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:${{ inputs.tag }}${{ inputs.cache_suffix }}-${{ matrix.arch }}
            ${{ inputs.cache_suffix != '' && format('type=registry,ref={0}:{1}-{2}', env.CACHE, inputs.tag, matrix.arch) || '' }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ inputs.tag }}-${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:{1}{2}-{3},mode=max,ignore-error=true', env.CACHE, inputs.tag, inputs.cache_suffix, matrix.arch) || '' }}
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      # Arch first, so the download pattern below cannot also match a longer tag that this
      # one is a prefix of (e.g. gnu-cpu-env vs gnu-cpu-env-dev).
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}-${{ inputs.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: ${{ inputs.tag }} (manifest)

    steps:
      # github.repository_owner is mixed case (E3SM-Project) and image refs must be
      # lowercase. metadata-action does this itself; a raw buildx ref does not.
      - name: Lowercase image ref
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          show-progress: false
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*-${{ inputs.tag }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The index needs its own annotations: for a multi-arch image GHCR takes the package
      # description from the index, not from the per-arch configs' labels.
      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # One tag, the run's own (see tag_suffix): consumer tags are promoted, not built.
          tags: |
            type=raw,value=${{ inputs.tag }}${{ inputs.tag_suffix }}
          labels: |
            org.opencontainers.image.title=${{ inputs.tag }}
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for f in *; do
            args+=("$IMAGE@$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}"

      # Read back what was actually published: a metadata step that is misconfigured or whose
      # output is never used fails silently otherwise. The expected revision and source come
      # from this run's own context, not from metadata-action's output, so a wrong value there
      # fails here instead of being compared against itself. Uses the `scripts/` checkout above.
      - name: Verify OCI labels and annotations
        env:
          TITLE: ${{ inputs.tag }}
          DESCRIPTION: ${{ inputs.description }}
          ARCHES: ${{ inputs.arches }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mapfile -t images < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          python3 scripts/check-oci-metadata.py "${images[@]}" \
            --arches "$ARCHES" --title "$TITLE" --description "$DESCRIPTION" \
            --revision "$REVISION" --source "$SOURCE"
