# Builds one image for several arches and publishes it under a SINGLE, arch-independent
# tag. Each arch is built natively on its own runner and pushed by digest; the merge job
# then stitches the digests into one manifest list, so `podman pull <tag>` resolves to the
# caller's arch and no tag ever needs an arch in its name.
name: build-multiarch

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Package name under ghcr.io/<owner>/'
        required: true
        type: string
      tag:
        description: 'Arch-independent tag to publish (e.g. gnu-cpu-env)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      arches:
        description: 'JSON array of arches to build'
        required: false
        type: string
        default: '["x86_64", "aarch64"]'
      build_args:
        required: false
        type: string
        default: ''
      description:
        required: false
        type: string
        default: ''
      release_pattern:
        description: 'Git tag pattern whose capture group becomes the image tag suffix'
        required: false
        type: string
        default: 'ghci-(.*)'
      tag_suffix:
        description: >-
          This run's suffix (e.g. -pr-42, -mg-<sha>), same as what the caller appends to
          BASE_TAG build-args; empty on a push to main. Scopes this run's own cache-to
          writes so a PR (or merge_group run) never overwrites the shared cache main and
          other PRs read from -- see the cache-from/cache-to comment below.
        required: false
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
  # A fork PR gets no packages:write, so nothing can be pushed and there is nothing to merge:
  # it still builds every stage, as validation, FROM the images main published. merge_group
  # runs are not excluded here: they publish too (under an ephemeral -mg-<sha> tag, see the
  # Meta step below), so that a stage this PR changes builds FROM the sibling stage this same
  # run just published, not from main's possibly-stale tag.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    name: ${{ inputs.tag }} (${{ matrix.arch }})

    steps:
      # github.repository_owner is mixed case (E3SM-Project) and image refs must be
      # lowercase. metadata-action does this itself; a raw buildx ref does not.
      - name: Lowercase image ref
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed to push; the parent images are public, so a fork PR pulls them anonymously.
      - name: GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          build-args: ${{ inputs.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=${{ env.PUSH }},name-canonical=true,push=${{ env.PUSH }}
          # Registry cache (one tag per compiler/env x arch, same as the images themselves) rather than
          # actions/cache: the latter is scoped per-branch and shares a repo-wide 10GB/7-day eviction
          # budget across every open PR, so a PR's own cache writes routinely evict main's (or each
          # other's) entries and the next build starts from scratch. A registry tag has no such quota
          # and isn't branch-scoped, so PRs and main naturally share it. Skipped on cache-to for fork
          # PRs, which can't push; they still read whatever main last published.
          #
          # cache-to only ever writes this run's own buildcache-<tag><tag_suffix>-<arch> tag, never
          # the plain buildcache-<tag>-<arch> one main and every other PR reads from: a PR (or
          # merge_group run) that touches this stage's Dockerfile would otherwise overwrite the
          # shared cache with its own not-yet-reviewed content, forcing every unrelated concurrent
          # PR (and main itself, if this PR never merges) into a cold rebuild the next time they
          # import it. cache-from still reads the plain tag too (as a second, lower-priority
          # source), so a PR's first build still benefits from whatever main last cached; its own
          # suffixed tag only exists once this run's cache-to has written it at least once (e.g. a
          # second push to the same PR), and a not-yet-existing cache-from source is a soft error
          # buildx logs and skips, not a build failure. tag_suffix is empty on a push to main, so
          # both cache-from lines and cache-to collapse onto the one plain tag, same as before.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ inputs.tag }}${{ inputs.tag_suffix }}-${{ matrix.arch }}
            ${{ inputs.tag_suffix != '' && format('type=registry,ref={0}:buildcache-{1}-{2}', env.IMAGE, inputs.tag, matrix.arch) || '' }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache-{1}{2}-{3},mode=max,ignore-error=true', env.IMAGE, inputs.tag, inputs.tag_suffix, matrix.arch) || '' }}
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      # Arch first, so the download pattern below cannot also match a longer tag that this
      # one is a prefix of (e.g. gnu-cpu-env vs gnu-cpu-env-dev).
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-${{ inputs.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: ${{ inputs.tag }} (manifest)

    steps:
      # github.repository_owner is mixed case (E3SM-Project) and image refs must be
      # lowercase. metadata-action does this itself; a raw buildx ref does not.
      - name: Lowercase image ref
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*-${{ inputs.tag }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr,prefix=${{ inputs.tag }}-pr-
            # metadata-action's `branch` ref type only checks that github.ref matches
            # refs/heads/*, with no event-name gating -- merge_group's temporary
            # gh-readonly-queue/... ref matches that too, so without disabling it here this
            # rule would additionally tag every merge_group build with a second, un-swept
            # tag derived from that throwaway ref name.
            type=ref,event=branch,prefix=${{ inputs.tag }}-,enable=${{ github.event_name != 'merge_group' }}
            type=match,pattern=${{ inputs.release_pattern }},group=1,prefix=${{ inputs.tag }}-
            # metadata-action has no dedicated `event=merge_group` ref type, so this is spelled
            # out by hand; it must match ghci.yaml's `suffix` job exactly (-mg-<full sha>), or
            # the two workflows disagree on what tag the merge job just published.
            type=raw,value=${{ inputs.tag }}-mg-${{ github.sha }},enable=${{ github.event_name == 'merge_group' }}
          labels: |
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for f in *; do
            args+=("$IMAGE@$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}"
